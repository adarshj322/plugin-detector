# Benchmark workflow. Publishing checks already installed, so that skill is redundant.
id: rw-redundant-publish
domain: research-writing
declaration: research-writing
signals:
  - latex-manifest
  - bibtex-library
installed:
  - id: installed-publish
    capabilities:
      - publishing.delivery
candidates:
  - id: rw-rp-draft
    name: RP Drafter
    capabilities:
      - docs.writing
    stars: 3100
  - id: rw-rp-ideas
    name: RP Ideation
    capabilities:
      - planning.brainstorm
    stars: 2200
  - id: rw-rp-data
    name: RP Data Writer
    capabilities:
      - data.analysis
    stars: 1800
  - id: rw-rp-prose
    name: RP Prose
    capabilities:
      - docs.writing
      - planning.brainstorm
    stars: 1600
  - id: rw-rp-dup
    name: Duplicate Publisher
    capabilities:
      - publishing.delivery
    stars: 900
  - id: pop-ship-line
    name: Ship Line
    capabilities:
      - ci.release
      - containers.orchestration
    stars: 130000
  - id: pop-render-farm
    name: Render Farm
    capabilities:
      - media.transcode
    stars: 120000
requiredCapabilities:
  - docs.writing
  - planning.brainstorm
  - data.analysis
  - publishing.delivery
optionalCapabilities: []
expectedRequiredIds:
  - rw-rp-draft
  - rw-rp-ideas
  - rw-rp-data
  - rw-rp-prose
expectedRedundantIds:
  - rw-rp-dup
unacceptableIds:
  - pop-ship-line
  - pop-render-farm
rationale: Publishing checks are already installed and enabled, so the duplicate must score redundant while drafting skills stay required.
