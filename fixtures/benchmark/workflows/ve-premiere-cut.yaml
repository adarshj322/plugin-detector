# Benchmark workflow. Premiere project expecting transcode and captions.
id: ve-premiere-cut
domain: video-editing
declaration: video-editing
signals:
  - premiere-project
  - ffmpeg-preset
  - caption-track
installed: []
candidates:
  - id: ve-opt-publish
    capabilities:
      - publishing.delivery
    stars: 1600
  - id: ve-transcode
    name: Transcode Helper
    capabilities:
      - media.transcode
    stars: 3400
  - id: ve-captions
    name: Caption Writer
    capabilities:
      - speech.captions
    stars: 2900
  - id: ve-thumbs
    name: Thumbnail Maker
    capabilities:
      - design.thumbnail
    stars: 2100
  - id: ve-pipeline
    name: Edit Pipeline
    capabilities:
      - media.transcode
      - speech.captions
    stars: 1800
  - id: ve-publish
    name: Publish Helper
    capabilities:
      - design.thumbnail
      - media.transcode
    stars: 1200
  - id: pop-test-pilot
    name: Test Pilot
    capabilities:
      - testing.runner
      - testing.e2e
    stars: 180000
  - id: pop-ship-line
    name: Ship Line
    capabilities:
      - ci.release
      - containers.orchestration
    stars: 130000
requiredCapabilities:
  - media.transcode
  - speech.captions
  - design.thumbnail
optionalCapabilities:
  - publishing.delivery
expectedRequiredIds:
  - ve-transcode
  - ve-captions
  - ve-thumbs
  - ve-pipeline
  - ve-publish
expectedRedundantIds: []
expectedOptionalIds:
  - ve-opt-publish
unacceptableIds:
  - pop-test-pilot
  - pop-ship-line
rationale: Editing research centers on transcode and captions, so labels track those capabilities and mega-star code skills are unacceptable.
