# Benchmark workflow. Zotero-backed paper expecting reference management.
id: rw-zotero-paper
domain: research-writing
declaration: research-writing
signals:
  - zotero-library
  - bibtex-library
  - markdown-notes
installed: []
candidates:
  - id: rw-refs
    name: Reference Manager
    capabilities:
      - docs.writing
      - publishing.delivery
    stars: 3500
  - id: rw-ideas
    name: Idea Explorer
    capabilities:
      - planning.brainstorm
    stars: 2100
  - id: rw-evidence
    name: Evidence Tables
    capabilities:
      - data.analysis
    stars: 2000
  - id: rw-prose
    name: Prose Polisher
    capabilities:
      - docs.writing
    stars: 1800
  - id: rw-submit
    name: Submission Prep
    capabilities:
      - publishing.delivery
    stars: 1500
  - id: pop-ship-line
    name: Ship Line
    capabilities:
      - ci.release
      - containers.orchestration
    stars: 130000
  - id: pop-render-farm
    name: Render Farm
    capabilities:
      - media.transcode
    stars: 120000
requiredCapabilities:
  - docs.writing
  - planning.brainstorm
  - data.analysis
  - publishing.delivery
optionalCapabilities: []
expectedRequiredIds:
  - rw-refs
  - rw-ideas
  - rw-evidence
  - rw-prose
  - rw-submit
expectedRedundantIds: []
unacceptableIds:
  - pop-ship-line
  - pop-render-farm
rationale: Zotero paper research stresses references and prose, so labels use writing capabilities and popular devops and media skills are unacceptable.
