# Benchmark workflow. Captions already installed, so that skill is redundant.
id: ve-redundant-captions
domain: video-editing
declaration: video-editing
signals:
  - premiere-project
  - caption-track
installed:
  - id: installed-captions
    capabilities:
      - speech.captions
candidates:
  - id: ve-rc-transcode
    name: RC Transcoder
    capabilities:
      - media.transcode
    stars: 3000
  - id: ve-rc-thumbs
    name: RC Thumbnails
    capabilities:
      - design.thumbnail
    stars: 2000
  - id: ve-rc-export
    name: RC Exporter
    capabilities:
      - media.transcode
      - design.thumbnail
    stars: 1700
  - id: ve-rc-master
    name: RC Mastering
    capabilities:
      - media.transcode
    stars: 1500
  - id: ve-rc-dup
    name: Duplicate Captioner
    capabilities:
      - speech.captions
    stars: 900
  - id: pop-test-pilot
    name: Test Pilot
    capabilities:
      - testing.runner
      - testing.e2e
    stars: 180000
  - id: pop-ship-line
    name: Ship Line
    capabilities:
      - ci.release
      - containers.orchestration
    stars: 130000
requiredCapabilities:
  - media.transcode
  - speech.captions
  - design.thumbnail
optionalCapabilities: []
expectedRequiredIds:
  - ve-rc-transcode
  - ve-rc-thumbs
  - ve-rc-export
  - ve-rc-master
expectedRedundantIds:
  - ve-rc-dup
unacceptableIds:
  - pop-test-pilot
  - pop-ship-line
rationale: Captions are already installed and enabled, so the duplicate must score redundant while transcode and thumbnail skills stay required.
